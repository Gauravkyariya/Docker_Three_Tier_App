services:
  db:
    image: mysql:8
    container_name: three-tier-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: three_tier_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    container_name: three-tier-backend
    env_file: ./Backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Fronrend
    container_name: three-tier-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
