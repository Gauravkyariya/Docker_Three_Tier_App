server {
    listen 80;   # Which port to listen on.
    root /usr/share/nginx/html;   # Where website files are located.
    index index.html;  # Which files to serve by default.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # forward API calls to the backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}  # This block lets Nginx forward API requests to your backend server.

# This configuration tells Nginx how to respond to incoming HTTP requests.
# Think of the server block as the collection of rules for handling incoming requests to your frontend.
# A reverse proxy receives a client's request and forwards it to another server, then relays the response to the client.

